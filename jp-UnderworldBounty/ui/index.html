<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jp-UnderworldBounty</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="hud-bounty" class="panel hud-hidden" aria-live="polite">
    <span class="hud-icon" aria-hidden="true">☠</span>
    <span id="hud-bounty-label"></span>
  </div>
  <div id="notify-stack" class="notify-stack" aria-live="polite" aria-relevant="additions"></div>
  <div id="minigame" class="mg-overlay mg-hidden">
    <div class="mg-card">
      <h2 id="mg-title"></h2>
      <p id="mg-desc" class="mg-desc"></p>
      <div id="mg-body"></div>
      <p id="mg-status" class="mg-status"></p>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
