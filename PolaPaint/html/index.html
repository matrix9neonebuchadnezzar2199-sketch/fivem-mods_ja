<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolaPaint</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="hidden">
    <div id="viewer" class="panel hidden">
      <div class="cheki">
        <div class="cheki-photo-wrap">
          <img id="viewer-img" alt="" />
        </div>
        <div class="cheki-caption">
          <span id="viewer-title"></span>
        </div>
      </div>
      <button type="button" id="viewer-close" class="btn primary"></button>
    </div>

    <div id="editor" class="panel hidden">
      <div class="editor-body">
        <div class="stage-wrap">
          <div class="stage" id="stage">
            <canvas id="cv-bg"></canvas>
            <canvas id="cv-draw"></canvas>
          </div>
        </div>
        <div class="toolbar">
          <div class="palette" id="palette"></div>
          <label class="pen-label"><span id="pen-label-text"></span>
            <input type="range" id="pen-size" min="2" max="28" value="6" />
          </label>
          <div class="btn-row">
            <button type="button" id="btn-undo" class="btn"></button>
            <button type="button" id="btn-clear" class="btn"></button>
            <button type="button" id="btn-save" class="btn primary"></button>
            <button type="button" id="editor-close" class="btn"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
