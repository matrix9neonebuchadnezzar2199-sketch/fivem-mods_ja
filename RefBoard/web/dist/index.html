    <title>RefBoard</title>
    <script>
      // FOUC 防止: stores/settings.ts より先に html.font-size を当てる。
      // STORAGE_KEY と既定値は stores/settings.ts と同期させること。
      (function () {
        try {
          var raw = localStorage.getItem('refboard_settings')
          var scale = 200
          if (raw) {
            var p = JSON.parse(raw)
            if (p && [100, 150, 200, 250, 300].indexOf(Number(p.rootFontScale)) !== -1) {
              scale = Number(p.rootFontScale)
            }
          }
          document.documentElement.style.fontSize = scale + '%'
        } catch (e) {
          document.documentElement.style.fontSize = '200%'
        }
      })()
    </script>
