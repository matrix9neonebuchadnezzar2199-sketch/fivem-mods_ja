<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="hud.css" />
  </head>
  <body>
    <div id="root" class="hud is-hidden" data-position="top-right">
      <div class="hud__panel">
        <div class="hud__title" id="title">タクシー勤務中</div>

        <div class="hud__section" id="meterSection">
          <div class="hud__row">
            <div class="hud__k" id="k_current_fare">現在の運賃</div>
            <div class="hud__v" id="v_current_fare">$0</div>
          </div>
          <div class="hud__row">
            <div class="hud__k" id="k_current_distance">走行距離</div>
            <div class="hud__v" id="v_current_distance">0.0 mi</div>
          </div>
        </div>

        <div class="hud__divider" id="statsDivider"></div>

        <div class="hud__section" id="statsSection">
          <div class="hud__row">
            <div class="hud__k" id="k_total_customers">累計客数</div>
            <div class="hud__v" id="v_total_customers">0</div>
          </div>
          <div class="hud__row">
            <div class="hud__k" id="k_total_earnings">累計稼ぎ</div>
            <div class="hud__v" id="v_total_earnings">$0</div>
          </div>
          <div class="hud__row">
            <div class="hud__k" id="k_total_distance">累計距離</div>
            <div class="hud__v" id="v_total_distance">0.0 mi</div>
          </div>
        </div>
      </div>

      <div class="hud__summary is-hidden" id="summary">
        <div class="hud__summaryTitle" id="summaryTitle">勤務終了</div>
        <div class="hud__summaryText" id="summaryGreat">お疲れ様でした！</div>
        <div class="hud__row">
          <div class="hud__k" id="k_s_customers">客数</div>
          <div class="hud__v" id="v_s_customers">0</div>
        </div>
        <div class="hud__row">
          <div class="hud__k" id="k_s_earnings">稼ぎ</div>
          <div class="hud__v" id="v_s_earnings">$0</div>
        </div>
        <div class="hud__row">
          <div class="hud__k" id="k_s_distance">走行距離</div>
          <div class="hud__v" id="v_s_distance">0.0 mi</div>
        </div>
      </div>
    </div>

    <script src="hud.js"></script>
  </body>
</html>
