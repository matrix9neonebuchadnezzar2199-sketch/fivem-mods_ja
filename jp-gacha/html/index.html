<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>jp-gacha</title>
</head>
<body>
    <div id="gacha-container" class="hidden">
        <div id="bg-layer">
            <img id="bg-image" src="" alt="">
        </div>

        <div id="flash-layer" class="hidden">
            <img src="img/flash_white.png" alt="">
        </div>

        <div id="particle-layer"></div>

        <div id="capsule-area">
            <img id="capsule-img" src="" alt="">
        </div>

        <div id="cutin-layer" class="hidden">
            <img id="cutin-img" src="" alt="">
        </div>

        <div id="result-layer" class="hidden">
            <div id="result-rarity"></div>
            <div id="result-item-name"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
