<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jp-card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="card-container">
        <div id="card" class="card">
            <div class="card-front">
                <span class="corner top-left"><span class="corner-rank"></span><span class="corner-suit"></span></span>
                <span class="card-rank"></span>
                <span class="card-suit-large"></span>
                <span class="corner bottom-right"><span class="corner-rank"></span><span class="corner-suit"></span></span>
                <div class="joker-label">JOKER</div>
            </div>
            <div class="card-back">
                <div class="back-diamond"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
