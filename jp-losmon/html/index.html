<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>jp-losmon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="zukan-modal" class="zukan-overlay hidden">
      <div class="zukan-panel">
        <h2>📖 図鑑 <button type="button" class="xbtn" id="zukan-close" aria-label="とじる">✕</button></h2>
        <div class="zukan-grid" id="zukan-body"></div>
      </div>
    </div>
    <div id="travel-confirm" class="travel-dialog hidden">
      <div class="td-inner">
        <p>本当に旅立たせますか？<br>ペットのデータは消え、図鑑は残ります。</p>
        <button type="button" id="travel-yes" class="btn-ok">はい</button>
        <button type="button" id="travel-no" class="btn-ng">いいえ</button>
      </div>
    </div>
    <div id="debug-evolve-modal" class="zukan-overlay hidden">
      <div class="zukan-panel">
        <h2>🛠 デバッグ — 進化先選択<button type="button" class="xbtn" id="debug-evolve-close">✕</button></h2>
        <p class="debug-evolve-help">選択すると 10 秒後に該当モンスターへ進化します</p>
        <div id="debug-evolve-list" class="debug-evolve-list"></div>
        <p id="debug-evolve-status" class="meta" hidden></p>
        <button type="button" id="debug-evolve-cancel" class="btn-sec" hidden>カウントダウンをキャンセル</button>
      </div>
    </div>
    <div id="main-expanded" class="hidden main-expanded">
      <div class="titlebar" id="ex-drag-lane">
        <span class="titlebar-brand">🐾 Los-Mon</span>
        <div class="ticker-outer" aria-label="お知らせ">
          <p class="ticker-marq" id="ticker-marq">💡 ミニペットの位置はドラッグで移動できます</p>
        </div>
        <button type="button" class="xbtn" id="close-ex" title="拡大を閉じる">✕</button>
      </div>
      <div class="ex-grid" id="ex-content">
        <div class="col left">
          <div class="care-tiles">
            <button type="button" class="care-tile tile-feed" data-a="feed">
              <span class="tile-ico">🍖</span>
              <span class="tile-label">ごはん</span>
              <span class="tile-cd cd" data-cd="feed"></span>
            </button>
            <button type="button" class="care-tile tile-play" data-a="play">
              <span class="tile-ico">🎮</span>
              <span class="tile-label">あそぶ</span>
              <span class="tile-cd cd" data-cd="play"></span>
            </button>
            <button type="button" class="care-tile tile-sleep" data-a="sleep">
              <span class="tile-ico">💤</span>
              <span class="tile-label">ねかす</span>
              <span class="tile-cd cd" data-cd="sleep"></span>
            </button>
            <button type="button" class="care-tile tile-clean" data-a="clean">
              <span class="tile-ico">🧹</span>
              <span class="tile-label">そうじ</span>
              <span class="tile-cd cd" data-cd="clean"></span>
            </button>
          </div>
          <div class="life-mode-panel" id="life-mode-panel">
            <label class="life-mode-row">
              <input type="checkbox" id="chk-immortal" class="life-mode-chk" />
              <span class="life-mode-label">
                <span class="life-mode-ico">💖</span>
                永遠のいのちモード
              </span>
            </label>
            <label class="life-mode-row">
              <input type="checkbox" id="chk-no-evolve" class="life-mode-chk" />
              <span class="life-mode-label">
                <span class="life-mode-ico">🔒</span>
                進化キャンセルモード
              </span>
            </label>
          </div>
          <div class="skin-panel" id="skin-panel">
            <div class="skin-panel-title">本体スキン</div>
            <div class="skin-options">
              <label class="skin-option">
                <input type="radio" name="skin" value="gray" class="skin-radio" />
                <span class="skin-swatch skin-swatch-gray"></span>
                <span class="skin-label">グレー</span>
              </label>
              <label class="skin-option">
                <input type="radio" name="skin" value="pink" class="skin-radio" />
                <span class="skin-swatch skin-swatch-pink"></span>
                <span class="skin-label">ピンク</span>
              </label>
            </div>
          </div>
        </div>
        <div class="col center" id="sprite-arena">
          <div class="device-wrap" id="device-wrap" aria-hidden="true">
            <div class="device-lcd" id="device-lcd">
              <div class="hatch" id="hatch-text"></div>
              <div class="sick-skull" id="sick-skull-main" hidden aria-hidden="true" title="病気">☠</div>
              <div class="flash" id="flash-fx"></div>
              <div class="sprite sprite-anim" id="sprite-el"></div>
              <div id="poop-layer" class="poop-layer" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="col right">
          <div class="info-card card-pet">
            <div class="card-row name-row" id="meta-n-row">
              <span class="name-text" id="meta-n-text">—</span>
              <button type="button" class="btn-pencil" id="btn-name-edit" title="名前を変える" aria-label="名前を変える">✎</button>
              <input type="text" class="name-input hidden" id="meta-n-input" maxlength="12" autocomplete="off" />
            </div>
            <div class="card-row level-row">
              <span class="level-label" id="meta-lv">LV —</span>
            </div>
            <div class="exp-bar barb expb"><b id="b-exp" style="width:0%"></b></div>
            <div class="card-row meta-sub" id="meta-walk">— / —</div>
          </div>
          <div class="info-card card-stats">
            <div class="stat-row">
              <span class="stat-ico" aria-hidden="true">🍖</span>
              <div class="stat-bar barb"><b id="b-h" class="bar-h" style="width:40%"></b></div>
              <span class="stat-val" id="v-h">—</span>
            </div>
            <div class="stat-row">
              <span class="stat-ico" aria-hidden="true">😊</span>
              <div class="stat-bar barb"><b id="b-m" class="bar-m" style="width:60%"></b></div>
              <span class="stat-val" id="v-m">—</span>
            </div>
            <div class="stat-row">
              <span class="stat-ico" aria-hidden="true">💪</span>
              <div class="stat-bar barb"><b id="b-s" class="bar-s" style="width:30%"></b></div>
              <span class="stat-val" id="v-s">—</span>
            </div>
            <div class="stat-row">
              <span class="stat-ico" aria-hidden="true">🛁</span>
              <div class="stat-bar barb"><b id="b-c" class="bar-c" style="width:50%"></b></div>
              <span class="stat-val" id="v-c">—</span>
            </div>
          </div>
          <div class="info-card card-meta">
            <div class="meta-line" id="meta-st">成長: —</div>
            <div class="meta-line" id="meta-time">経過: —</div>
            <div class="meta-line" id="meta-lottery" hidden></div>
            <div class="meta-line warn" id="meta-sick" hidden>⚠ 病気です。ごはんと掃除で治療を</div>
            <div class="meta-line" id="meta-dhead" hidden></div>
          </div>
        </div>
        <div class="footer-toolbar">
          <button type="button" class="footer-btn footer-btn-debug" id="btn-debug-evolve" hidden>
            <span class="footer-ico" aria-hidden="true">🛠</span>
            <span class="footer-label">デバッグ</span>
          </button>
          <button type="button" class="footer-btn" id="btn-zukan">
            <span class="footer-ico" aria-hidden="true">📖</span>
            <span class="footer-label">図鑑</span>
          </button>
          <button type="button" class="footer-btn" id="btn-reset-mini">
            <span class="footer-ico" aria-hidden="true">↻</span>
            <span class="footer-label">ミニ位置</span>
          </button>
          <button type="button" class="footer-btn footer-btn-travel" id="btn-travel" hidden>
            <span class="footer-ico" aria-hidden="true">🛫</span>
            <span class="footer-label">旅立たせる</span>
          </button>
          <button type="button" class="footer-btn footer-btn-new" id="btn-new" hidden>
            <span class="footer-ico" aria-hidden="true">🥚</span>
            <span class="footer-label">新しい卵</span>
          </button>
        </div>
      </div>
    </div>
    <div id="mini-pet" class="mini-pet">
      <div class="mini-device" id="mini-device">
        <div class="mini-lcd" id="mini-lcd">
          <div class="mini-lvup" id="mini-lvup" hidden aria-hidden="true">LvUP！</div>
          <div class="sick-skull mini-sick-skull" id="sick-skull-mini" hidden aria-hidden="true" title="病気">☠</div>
          <div class="mini-sprite" id="mini-sprite"></div>
        </div>
      </div>
      <div class="mini-exp" aria-hidden="true">
        <span class="mini-exp-label">EXP</span>
        <div class="mini-exp-bar">
          <div class="mini-exp-fill" id="mini-exp-fill"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
